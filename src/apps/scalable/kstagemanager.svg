<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>

    <!-- Center Stage Glass Gradient -->
    <linearGradient id="centerStageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#252528"/>
    </linearGradient>

    <!-- Side Stage Thumbnail Gradient -->
    <linearGradient id="sideCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#545458"/>
      <stop offset="100%" stop-color="#3A3A3C"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle (macOS style) -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" stroke="#48484A" stroke-width="2"/>

  <!-- Left Sidebar: Three Stage Thumbnail Cards -->
  <!-- Thumbnail 1 (Top) -->
  <rect x="74" y="110" width="76" height="54" rx="10" ry="10" fill="url(#sideCardGrad)" stroke="#636366" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="90" cy="122" r="3" fill="#FF5F56"/>
  <circle cx="100" cy="122" r="3" fill="#FFBD2E"/>
  <circle cx="110" cy="122" r="3" fill="#27C93F"/>

  <!-- Thumbnail 2 (Middle) -->
  <rect x="74" y="196" width="76" height="54" rx="10" ry="10" fill="url(#sideCardGrad)" stroke="#636366" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="90" cy="208" r="3" fill="#FF5F56"/>
  <circle cx="100" cy="208" r="3" fill="#FFBD2E"/>
  <circle cx="110" cy="208" r="3" fill="#27C93F"/>

  <!-- Thumbnail 3 (Bottom) -->
  <rect x="74" y="282" width="76" height="54" rx="10" ry="10" fill="url(#sideCardGrad)" stroke="#636366" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="90" cy="294" r="3" fill="#FF5F56"/>
  <circle cx="100" cy="294" r="3" fill="#FFBD2E"/>
  <circle cx="110" cy="294" r="3" fill="#27C93F"/>

  <!-- Center Active Stage Window -->
  <rect x="180" y="110" width="258" height="226" rx="16" ry="16" fill="url(#centerStageGrad)" stroke="#0A84FF" stroke-width="2.5" filter="url(#cardShadow)"/>
  
  <!-- Center Window Titlebar -->
  <path d="M 180 126 A 16 16 0 0 1 196 110 L 422 110 A 16 16 0 0 1 438 126 L 438 138 L 180 138 Z" fill="#2C2C2E"/>
  <circle cx="204" cy="124" r="4.5" fill="#FF5F56"/>
  <circle cx="218" cy="124" r="4.5" fill="#FFBD2E"/>
  <circle cx="232" cy="124" r="4.5" fill="#27C93F"/>

  <!-- Center Window Content Area / Glow -->
  <rect x="198" y="154" width="222" height="164" rx="8" ry="8" fill="#1C1C1E" opacity="0.6"/>
  <rect x="214" y="174" width="110" height="12" rx="4" ry="4" fill="#636366" opacity="0.5"/>
  <rect x="214" y="198" width="170" height="8" rx="3" ry="3" fill="#48484A" opacity="0.4"/>
  <rect x="214" y="214" width="150" height="8" rx="3" ry="3" fill="#48484A" opacity="0.4"/>
  <rect x="214" y="230" width="130" height="8" rx="3" ry="3" fill="#48484A" opacity="0.4"/>

  <!-- Bottom Accent Pill -->
  <rect x="236" y="380" width="146" height="6" rx="3" ry="3" fill="#0A84FF" opacity="0.8"/>
</svg>
