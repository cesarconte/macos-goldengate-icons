  <!-- White Squircle Body -->
  <rect
     x="4"
     y="4"
     width="56"
     height="56"
     rx="13"
     ry="13"
     fill="url(#bgGradient)"
     stroke="rgba(0,0,0,0.08)"
     stroke-width="0.5"
     id="baseSquircle" />

  <!-- Inner Soft Bevel / Highlight -->
  <rect
     x="4.5"
     y="4.5"
     width="55"
     height="55"
     rx="12.5"
     ry="12.5"
     fill="none"
     stroke="#ffffff"
     stroke-width="0.6"
     opacity="0.8" />

  <!-- Search Capsule / Pill -->
  <g id="searchPillGroup">
    <rect
       x="14"
       y="11.5"
       width="36"
       height="7.5"
       rx="3.75"
       ry="3.75"
       fill="url(#searchPillGrad)"
       stroke="rgba(0,0,0,0.06)"
       stroke-width="0.4"
       id="searchCapsule" />
    
    <!-- Magnifying Glass Icon -->
    <circle
       cx="18.5"
       cy="15.25"
       r="1.65"
       fill="none"
       stroke="#8e8e93"
       stroke-width="0.9" />
    <path
       d="M 19.7 16.45 L 21.6 18.35"
       stroke="#8e8e93"
       stroke-width="0.9"
       stroke-linecap="round" />

    <!-- Simulated Search Text Bar / Placeholder -->
    <rect
       x="23.5"
       y="14.5"
       width="11"
       height="1.5"
       rx="0.75"
       ry="0.75"
       fill="#a0a0a5"
       opacity="0.7" />
  </g>

  <!-- 2x3 Grid of Mini Apps -->
  <g id="appGrid">
    <!-- ROW 1 -->
    <!-- Col 1: Blue App -->
    <g id="miniApp1_Blue">
      <!-- Drop shadow -->
      <rect x="13.5" y="23.1" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="rgba(0,0,0,0.12)" />
      <!-- Body -->
      <rect x="13.5" y="22.5" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="url(#appBlue)" />
      <!-- Top Sheen -->
      <rect x="13.5" y="22.5" width="9.5" height="4.5" rx="2.4" ry="2.4" fill="url(#appSheen)" />
      <rect x="13.5" y="22.5" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.4" />
    </g>

    <!-- Col 2: Green App -->
    <g id="miniApp2_Green">
      <!-- Drop shadow -->
      <rect x="27.25" y="23.1" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="rgba(0,0,0,0.12)" />
      <!-- Body -->
      <rect x="27.25" y="22.5" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="url(#appGreen)" />
      <!-- Top Sheen -->
      <rect x="27.25" y="22.5" width="9.5" height="4.5" rx="2.4" ry="2.4" fill="url(#appSheen)" />
      <rect x="27.25" y="22.5" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.4" />
    </g>

    <!-- Col 3: Red App -->
    <g id="miniApp3_Red">
      <!-- Drop shadow -->
      <rect x="41.0" y="23.1" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="rgba(0,0,0,0.12)" />
      <!-- Body -->
      <rect x="41.0" y="22.5" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="url(#appRed)" />
      <!-- Top Sheen -->
      <rect x="41.0" y="22.5" width="9.5" height="4.5" rx="2.4" ry="2.4" fill="url(#appSheen)" />
      <rect x="41.0" y="22.5" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.4" />
    </g>

    <!-- ROW 2 -->
    <!-- Col 1: Orange App -->
    <g id="miniApp4_Orange">
      <!-- Drop shadow -->
      <rect x="13.5" y="36.85" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="rgba(0,0,0,0.12)" />
      <!-- Body -->
      <rect x="13.5" y="36.25" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="url(#appOrange)" />
      <!-- Top Sheen -->
      <rect x="13.5" y="36.25" width="9.5" height="4.5" rx="2.4" ry="2.4" fill="url(#appSheen)" />
      <rect x="13.5" y="36.25" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.4" />
    </g>

    <!-- Col 2: Purple App -->
    <g id="miniApp5_Purple">
      <!-- Drop shadow -->
      <rect x="27.25" y="36.85" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="rgba(0,0,0,0.12)" />
      <!-- Body -->
      <rect x="27.25" y="36.25" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="url(#appPurple)" />
      <!-- Top Sheen -->
      <rect x="27.25" y="36.25" width="9.5" height="4.5" rx="2.4" ry="2.4" fill="url(#appSheen)" />
      <rect x="27.25" y="36.25" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.4" />
    </g>

    <!-- Col 3: Slate Grey App -->
    <g id="miniApp6_Grey">
      <!-- Drop shadow -->
      <rect x="41.0" y="36.85" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="rgba(0,0,0,0.12)" />
      <!-- Body -->
      <rect x="41.0" y="36.25" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="url(#appGrey)" />
      <!-- Top Sheen -->
      <rect x="41.0" y="36.25" width="9.5" height="4.5" rx="2.4" ry="2.4" fill="url(#appSheen)" />
      <rect x="41.0" y="36.25" width="9.5" height="9.5" rx="2.4" ry="2.4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.4" />
    </g>
  </g>
</svg>
