<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="64"
   height="64"
   version="1.1"
   id="svg_launchpad"
   viewBox="0 0 64 64"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs_launchpad">
    <linearGradient
       id="bgGradient"
       x1="7.9373"
       x2="7.9373"
       y1="15.081"
       y2="1.852"
       gradientTransform="scale(3.7796)"
       gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1efeb" offset="0" id="stop1" />
      <stop stop-color="#fdfcfc" offset="1" id="stop2" />
    </linearGradient>

    <!-- Search pill gradient -->
    <linearGradient id="searchPillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e2e2e7" offset="0%" />
      <stop stop-color="#d8d8de" offset="100%" />
    </linearGradient>

    <!-- Mini Apps Gradients -->
    <!-- Blue (App Store / Safari) -->
    <linearGradient id="appBlue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#38a5ff" offset="0%" />
      <stop stop-color="#006ee6" offset="100%" />
    </linearGradient>

    <!-- Green (Messages / Phone) -->
    <linearGradient id="appGreen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4cd964" offset="0%" />
      <stop stop-color="#28b446" offset="100%" />
    </linearGradient>

    <!-- Red (Music) -->
    <linearGradient id="appRed" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff453a" offset="0%" />
      <stop stop-color="#d70015" offset="100%" />
    </linearGradient>

    <!-- Orange (Notes) -->
    <linearGradient id="appOrange" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff9f0a" offset="0%" />
      <stop stop-color="#ea6d00" offset="100%" />
    </linearGradient>

    <!-- Purple (Podcasts) -->
    <linearGradient id="appPurple" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bf5af2" offset="0%" />
      <stop stop-color="#8944ab" offset="100%" />
    </linearGradient>

    <!-- Grey (Settings) -->
    <linearGradient id="appGrey" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#98989d" offset="0%" />
      <stop stop-color="#636366" offset="100%" />
    </linearGradient>

    <!-- Subtle specular sheen for mini icons -->
    <linearGradient id="appSheen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.35" offset="0%" />
      <stop stop-color="#ffffff" stop-opacity="0.0" offset="100%" />
    </linearGradient>
  </defs>

