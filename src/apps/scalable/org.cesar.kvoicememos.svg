<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2e32"/>
      <stop offset="100%" stop-color="#1b1e20"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee3b3b"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#bgGrad)" stroke="#3d4348" stroke-width="1.5" filter="url(#subtleGlow)"/>

  <!-- Voice Memos Audio Waveform (Apple Voice Memos style with Breeze geometry) -->
  <g fill="url(#waveGrad)">
    <rect x="12" y="27" width="4" height="10" rx="2"/>
    <rect x="18" y="21" width="4" height="22" rx="2"/>
    <rect x="24" y="15" width="4" height="34" rx="2"/>
    <rect x="30" y="9"  width="4" height="46" rx="2"/>
    <rect x="36" y="17" width="4" height="30" rx="2"/>
    <rect x="42" y="23" width="4" height="18" rx="2"/>
    <rect x="48" y="28" width="4" height="8"  rx="2"/>
  </g>
</svg>
